<svg xmlns="http://www.w3.org/2000/svg" width="380" height="64" viewBox="0 0 380 64" role="img" aria-label="Смотреть портфолио">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2a78d6"/>
      <stop offset="1" stop-color="#104281"/>
    </linearGradient>
  </defs>
  <style>
    .t { font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; fill: #ffffff; }
    .arrow { animation: nudge 1.6s ease-in-out infinite; }
    @keyframes nudge { 0%,100% { transform: translateX(0); } 50% { transform: translateX(5px); } }
  </style>
  <rect x="1" y="1" width="378" height="62" rx="31" fill="url(#g)" stroke="#6da7ec" stroke-opacity="0.6" stroke-width="2"/>
  <!-- иконка папки -->
  <path d="M34 22 h12 l4 5 h18 a3 3 0 0 1 3 3 v14 a3 3 0 0 1 -3 3 h-34 a3 3 0 0 1 -3 -3 v-19 a3 3 0 0 1 3 -3 z" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linejoin="round"/>
  <text x="86" y="31" class="t" font-size="19" font-weight="700">Смотреть портфолио</text>
  <text x="86" y="50" class="t" font-size="13" fill-opacity="0.85" style="fill:#cde2fb">10 кейсов автоматизации</text>
  <g class="arrow">
    <path d="M328 32 h22 m-8 -8 l8 8 l-8 8" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
