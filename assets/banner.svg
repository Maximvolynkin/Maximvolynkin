<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="Автоматизация бизнес-процессов">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="0.55" stop-color="#0f2744"/>
      <stop offset="1" stop-color="#104281"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
  </defs>
  <style>
    .f { font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; }
    .title { font-size: 48px; font-weight: 700; fill: #ffffff; }
    .sub { font-size: 22px; fill: #9ec5f4; }
    .rot { font-size: 19px; fill: #ffffff; opacity: 0; animation: rot 12s infinite; }
    .r2 { animation-delay: 4s; } .r3 { animation-delay: 8s; }
    @keyframes rot { 0% {opacity:0; transform: translateY(8px);} 4% {opacity:1; transform: translateY(0);} 30% {opacity:1;} 34% {opacity:0;} 100% {opacity:0;} }
    .caret { fill: #3987e5; animation: blink 1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    .node rect { fill: #ffffff; fill-opacity: 0.06; stroke: #3987e5; stroke-opacity: 0.7; }
    .node text { font-size: 15px; fill: #ffffff; font-weight: 600; }
    .node .s { font-size: 12px; fill: #9ec5f4; font-weight: 400; }
    .dot { fill: #6da7ec; animation: flow 3s linear infinite; }
    .d2 { animation-delay: 1s; } .d3 { animation-delay: 2s; }
    @keyframes flow { 0% { transform: translateY(0); opacity: 0; } 10% {opacity:1;} 90% {opacity:1;} 100% { transform: translateY(198px); opacity: 0; } }
    .pulse { fill: #1baf7a; animation: pulse 2s ease-in-out infinite; transform-origin: 1110px 266px; }
    @keyframes pulse { 0%,100% { transform: scale(1); opacity: 1;} 50% { transform: scale(1.6); opacity: 0.4;} }
  </style>

  <rect width="1200" height="320" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="320" rx="18" fill="url(#grid)"/>

  <g class="f">
    <text x="60" y="100" class="title">Автоматизация</text>
    <text x="60" y="154" class="title">бизнес-процессов</text>
    <text x="60" y="194" class="sub">Превращаю ручную рутину в работающие системы</text>
    <rect x="60" y="226" width="4" height="26" class="caret"/>
    <text x="76" y="246" class="rot r1">Анализ процессов · интеграция систем · отчётность · AI</text>
    <text x="76" y="246" class="rot r2">Меньше рутины — больше результата</text>
    <text x="76" y="246" class="rot r3">Результат: 3 часа ручной работы в день → 5 минут</text>
  </g>

  <g class="f">
    <line x1="834" y1="58" x2="834" y2="262" stroke="#3987e5" stroke-opacity="0.6" stroke-width="2"/>
    <circle cx="834" cy="58" r="4" class="dot"/>
    <circle cx="834" cy="58" r="4" class="dot d2"/>
    <circle cx="834" cy="58" r="4" class="dot d3"/>

    <g class="node"><rect x="860" y="34" width="290" height="48" rx="10"/>
      <text x="880" y="56">Ручные операции</text><text x="880" y="73" class="s">почта · таблицы · выгрузки</text></g>
    <g class="node"><rect x="860" y="100" width="290" height="48" rx="10"/>
      <text x="880" y="122">Анализ процесса</text><text x="880" y="139" class="s">где теряется время и деньги</text></g>
    <g class="node"><rect x="860" y="166" width="290" height="48" rx="10"/>
      <text x="880" y="188">Автоматизация · AI</text><text x="880" y="205" class="s">интеграции без ручного ввода</text></g>
    <g class="node"><rect x="860" y="232" width="290" height="54" rx="10" style="fill:#104281;fill-opacity:1;stroke:#3987e5"/>
      <text x="880" y="255">Готовый результат</text><text x="880" y="273" class="s">отчёты · дашборды · контроль</text></g>
    <circle cx="1110" cy="266" r="5" class="pulse"/>
  </g>
</svg>
